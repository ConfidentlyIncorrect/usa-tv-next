# Self-contained Tailscale Funnel deployment.
#
# Brings up the addon + a Tailscale sidecar that exposes it publicly at
#   https://<hostname>.<your-tailnet>.ts.net
# with automatic Let's Encrypt HTTPS, no port-forwarding, and a STABLE url.
#
# One-time:
#   1. Create a reusable auth key: https://login.tailscale.com/admin/settings/keys
#   2. In the Tailscale admin, enable HTTPS + Funnel for your tailnet
#      (Settings -> Features -> HTTPS Certificates, and the Funnel node attribute / ACL).
#   3. export TS_AUTHKEY=tskey-auth-xxxxx
#   4. docker compose -f docker-compose.funnel.yml up -d --build
#
# The addon AUTO-DETECTS its public ts.net base from the Funnel Host header, so the
# stream proxy turns on automatically — no PROXY_PUBLIC_URL needed.
#
# Install URL in Stremio/Nuvio:  https://<hostname>.<tailnet>.ts.net/manifest.json

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: usa-tv-next-ts
    hostname: usa-tv-next            # -> usa-tv-next.<tailnet>.ts.net
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set TS_AUTHKEY (tskey-auth-...) before composing}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/funnel.json   # funnels :443 -> 127.0.0.1:7001
      - TS_EXTRA_ARGS=--hostname=usa-tv-next
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale/funnel.json:/config/funnel.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

  usa-tv-next:
    build: .
    container_name: usa-tv-next
    # Share the Tailscale container's network namespace so Funnel can reach the addon
    # on 127.0.0.1:7001 (see funnel.json). The addon publishes no host ports here — all
    # public access is via the Funnel HTTPS endpoint.
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    environment:
      - PORT=7001
      - HOST=0.0.0.0
      - TZ=America/Denver
      - EPG_URL=https://epg.pw/xmltv/epg_US.xml
      - GITHUB_RAW_BASE=https://raw.githubusercontent.com/ConfidentlyIncorrect/usa-tv-next/main
      - LOG_LEVEL=info
      - NODE_OPTIONS=--max-old-space-size=3072
      # The proxy auto-detects its public base from the Funnel Host header on the first
      # request. If it doesn't latch (some forwarders rewrite Host), set it EXPLICITLY to
      # your node's Funnel URL — this is the reliable, immediate option:
      # - PROXY_PUBLIC_URL=https://usa-tv-next.<your-tailnet>.ts.net
      # (find <your-tailnet> in the Tailscale admin; with hostname 'usa-tv-next' above the
      #  full URL is usa-tv-next.<tailnet>.ts.net)
    volumes:
      - usatv-cache:/app/cache
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g

volumes:
  usatv-cache:
  tailscale-state:
