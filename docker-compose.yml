services:
  usa-tv-next:
    build: .
    container_name: usa-tv-next
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      - PORT=7001
      - HOST=0.0.0.0
      - TZ=America/Denver
      - EPG_URL=https://epg.pw/xmltv/epg_US.xml
      # 3rd-tier EPG gap-fill (epgshare01.online — FAST/streaming channels SD + epg.pw lack).
      # On by default; set EPGSHARE_URLS= (empty) to disable, or override with your own list.
      # - EPGSHARE_URLS=https://epgshare01.online/epgshare01/epg_ripper_US2.xml.gz,https://epgshare01.online/epgshare01/epg_ripper_PLEX1.xml.gz,https://epgshare01.online/epgshare01/epg_ripper_DISTROTV1.xml.gz
      # Schedules Direct (PRIMARY EPG when set; ~$35/yr, accurate feed/timezone-correct US
      # listings). Falls back to EPG_URL above on ANY failure, so it's safe to leave unset.
      # Setup is just creds + your ZIP: SD_ZIP makes the server AUTO-ADD a comprehensive lineup
      # via SD's API (prefers a national DirecTV/Dish satellite lineup that carries nearly all
      # these channels + your local affiliates) — no manual lineup curation. It only adds when
      # the account has none, and never removes. SD_DAYS = days of guide; SD_LINEUP optionally
      # restricts station collection to one lineup (substring); SD_TRANSPORT overrides the
      # Satellite preference (Cable/Antenna/IPTV).
      # - SD_USERNAME=your_sd_username
      # - SD_PASSWORD=your_sd_password
      # - SD_ZIP=80202
      # - SD_DAYS=2
      # - SD_TRANSPORT=Satellite
      # Repo the server fetches the latest roster + stream files from (the "fetch" leg
      # of the hybrid data layer). Bundled local files are the offline baseline.
      - GITHUB_RAW_BASE=https://raw.githubusercontent.com/ConfidentlyIncorrect/usa-tv-next/main
      - DATA_REFRESH_HOURS=6
      - EPG_REFRESH_HOURS=6
      # Stream proxy: makes fragile feeds (plain-HTTP / raw-IP / odd-port / header-gated)
      # play reliably — the server fetches them with proper headers and rewrites HLS so
      # segments are proxied too. The public base is AUTO-DETECTED from the request Host
      # (behind Tailscale Funnel / a reverse proxy it needs nothing). Force an explicit
      # base with PROXY_PUBLIC_URL, or turn it off with PROXY_DISABLE=1.
      # - PROXY_PUBLIC_URL=https://tv.example.com
      # For a turnkey Tailscale Funnel deployment, use docker-compose.funnel.yml instead.
      # Set to "debug" for verbose per-request routing / cache / fetch logging.
      - LOG_LEVEL=info
      - NODE_OPTIONS=--max-old-space-size=3072
    volumes:
      # Persist the emergency cache across restarts/redeploys.
      - usatv-cache:/app/cache
    deploy:
      resources:
        limits:
          memory: 4g

volumes:
  usatv-cache:
