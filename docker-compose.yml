services:
  usa-tv-next:
    build: .
    container_name: usa-tv-next
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      - PORT=7001
      - HOST=0.0.0.0
      - TZ=America/Denver
      - EPG_URL=https://epg.pw/xmltv/epg_US.xml
      # Repo the server fetches the latest roster + stream files from (the "fetch" leg
      # of the hybrid data layer). Bundled local files are the offline baseline.
      - GITHUB_RAW_BASE=https://raw.githubusercontent.com/ConfidentlyIncorrect/usa-tv-next/main
      - DATA_REFRESH_HOURS=6
      - EPG_REFRESH_HOURS=6
      # Set to "debug" for verbose per-request routing / cache / fetch logging.
      - LOG_LEVEL=info
      - NODE_OPTIONS=--max-old-space-size=3072
    volumes:
      # Persist the emergency cache across restarts/redeploys.
      - usatv-cache:/app/cache
    deploy:
      resources:
        limits:
          memory: 4g

volumes:
  usatv-cache:
