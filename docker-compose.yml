services:
  usa-tv-next:
    build: .
    container_name: usa-tv-next
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      - PORT=7001
      - HOST=0.0.0.0
      - TZ=America/Denver
      - EPG_URL=https://epg.pw/xmltv/epg_US.xml
      # Repo the server fetches the latest roster + stream files from (the "fetch" leg
      # of the hybrid data layer). Bundled local files are the offline baseline.
      - GITHUB_RAW_BASE=https://raw.githubusercontent.com/ConfidentlyIncorrect/usa-tv-next/main
      - DATA_REFRESH_HOURS=6
      - EPG_REFRESH_HOURS=6
      # Stream proxy: makes fragile feeds (plain-HTTP / raw-IP / odd-port / header-gated)
      # play reliably — the server fetches them with proper headers and rewrites HLS so
      # segments are proxied too. The public base is AUTO-DETECTED from the request Host
      # (behind Tailscale Funnel / a reverse proxy it needs nothing). Force an explicit
      # base with PROXY_PUBLIC_URL, or turn it off with PROXY_DISABLE=1.
      # - PROXY_PUBLIC_URL=https://tv.example.com
      # For a turnkey Tailscale Funnel deployment, use docker-compose.funnel.yml instead.
      # Set to "debug" for verbose per-request routing / cache / fetch logging.
      - LOG_LEVEL=info
      - NODE_OPTIONS=--max-old-space-size=3072
    volumes:
      # Persist the emergency cache across restarts/redeploys.
      - usatv-cache:/app/cache
    deploy:
      resources:
        limits:
          memory: 4g

volumes:
  usatv-cache:
