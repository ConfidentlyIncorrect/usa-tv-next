services:
  usa-tv-next:
    build: .
    container_name: usa-tv-next
    restart: unless-stopped
    ports:
      - "7001:7001"
    environment:
      - PORT=7001
      - HOST=0.0.0.0
      - TZ=America/Denver
      - EPG_URL=https://epg.pw/xmltv/epg_US.xml
      # 3rd-tier EPG gap-fill for FAST/streaming channels SD + epg.pw lack. Default = epgshare01
      # US2 + Matt Huisman (i.mjh.nz) Samsung TV Plus / Plex / Pluto / Roku. On by default; set
      # EPGSHARE_URLS= (empty) to disable, or override with your own comma-separated list.
      # - EPGSHARE_URLS=https://epgshare01.online/epgshare01/epg_ripper_US2.xml.gz,https://i.mjh.nz/SamsungTVPlus/us.xml.gz,https://i.mjh.nz/Plex/all.xml.gz,https://i.mjh.nz/PlutoTV/us.xml.gz,https://i.mjh.nz/Roku/all.xml.gz
      # Schedules Direct (PRIMARY EPG when set; ~$35/yr, accurate feed/timezone-correct US
      # listings). Falls back to EPG_URL above on ANY failure, so it's safe to leave unset.
      # Setup is just creds + your ZIP: SD_ZIP makes the server AUTO-ADD a comprehensive lineup
      # via SD's API (prefers a national DirecTV/Dish satellite lineup that carries nearly all
      # these channels + your local affiliates) — no manual lineup curation. It only adds when
      # the account has none, and never removes. SD_DAYS = days of guide; SD_LINEUP optionally
      # restricts station collection to one lineup (substring); SD_TRANSPORT overrides the
      # Satellite preference (Cable/Antenna/IPTV).
      # - SD_USERNAME=your_sd_username
      # - SD_PASSWORD=your_sd_password
      # - SD_ZIP=80202
      # - SD_DAYS=2
      # - SD_TRANSPORT=Satellite
      # Repo the server fetches the latest roster + stream files from (the "fetch" leg
      # of the hybrid data layer). Bundled local files are the offline baseline.
      - GITHUB_RAW_BASE=https://raw.githubusercontent.com/ConfidentlyIncorrect/usa-tv-next/main
      - DATA_REFRESH_HOURS=6
      - EPG_REFRESH_HOURS=6
      # Stream proxy: makes fragile feeds (plain-HTTP / raw-IP / odd-port / header-gated)
      # play reliably — the server fetches them with proper headers and rewrites HLS so
      # segments are proxied too. The public base is AUTO-DETECTED from the request Host
      # (behind Tailscale Funnel / a reverse proxy it needs nothing). Force an explicit
      # base with PROXY_PUBLIC_URL, or turn it off with PROXY_DISABLE=1.
      # - PROXY_PUBLIC_URL=https://tv.example.com
      # SPLIT-TUNNEL FOR DADDYLIVE: DaddyLive's premium embed + CDN origins drop datacenter/VPS
      # egress IPs (you'll see `dlhd ... cannot reach <host>: CONNECT_TIMEOUT` even though dlhd.pk
      # itself works). A VPN exit fixes it — but route ONLY the DaddyLive fetches through it, not
      # the whole addon. Uncomment the `gluetun` sidecar below + this line; everything else (EPG,
      # GitHub, iptv-org, Tubi, tvpass, …) keeps egressing directly.
      # - DLHD_OUTBOUND_PROXY=http://gluetun:8888
      # For a turnkey Tailscale Funnel deployment, use docker-compose.funnel.yml instead.
      # Set to "debug" for verbose per-request routing / cache / fetch logging.
      - LOG_LEVEL=info
      - NODE_OPTIONS=--max-old-space-size=3072
    volumes:
      # Persist the emergency cache across restarts/redeploys.
      - usatv-cache:/app/cache
    # If the logs show `dlhd ... cannot reach <host>: ENOTFOUND` (or EAI_AGAIN), a FILTERING
    # DNS on this network (Pi-hole / NextDNS / AdGuard / Cloudflare-Family 1.1.1.3) is blocking
    # DaddyLive's resolver + CDN domains. Uncomment to give just this container a plain resolver
    # (this does NOT affect the rest of your network). A `cannot reach ...: ECONNREFUSED`/timeout
    # instead means the host blocks this server's egress IP — a DNS change won't help there.
    # dns:
    #   - 1.1.1.1
    #   - 8.8.8.8
    deploy:
      resources:
        limits:
          memory: 4g

  # ── DaddyLive split-tunnel VPN sidecar (optional) ─────────────────────────────────────────
  # Routes ONLY DaddyLive traffic out through a VPN, via gluetun's built-in HTTP proxy on :8888.
  # The addon reaches it as http://gluetun:8888 (set DLHD_OUTBOUND_PROXY above). gluetun supports
  # WireGuard + OpenVPN and most providers — fill in your provider/creds. Docs: github.com/qdm12/gluetun
  # gluetun:
  #   image: qmcgaw/gluetun
  #   container_name: gluetun
  #   restart: unless-stopped
  #   cap_add:
  #     - NET_ADMIN
  #   devices:
  #     - /dev/net/tun:/dev/net/tun
  #   environment:
  #     - HTTPPROXY=on                 # expose the HTTP proxy on :8888 (what the addon uses)
  #     # REQUIRED: gluetun's built-in "malicious domains" DNS blocklist (default ON) blackholes
  #     # DaddyLive's domains -> the proxy CONNECT hangs -> the addon TIMES OUT (looks like a
  #     # block but isn't). Turn it off or DaddyLive won't resolve through the VPN.
  #     - BLOCK_MALICIOUS=off
  #     # --- NordVPN (confirmed working) — OpenVPN with SERVICE credentials ---
  #     # Get these from the Nord dashboard > "Set up NordVPN manually" > Service credentials
  #     # (a username + password that are NOT your account login).
  #     - VPN_SERVICE_PROVIDER=nordvpn
  #     - VPN_TYPE=openvpn
  #     - OPENVPN_USER=<nord-service-username>
  #     - OPENVPN_PASSWORD=<nord-service-password>
  #     - SERVER_COUNTRIES=United States      # pin a region/server that passed the viability test
  #     # --- or a custom WireGuard config (a provider .conf or your home WG) ---
  #     # - VPN_SERVICE_PROVIDER=custom
  #     # - VPN_TYPE=wireguard
  #     # - VPN_ENDPOINT_IP=<server-ip>
  #     # - VPN_ENDPOINT_PORT=51820
  #     # - WIREGUARD_PUBLIC_KEY=<server-pubkey>
  #     # - WIREGUARD_PRIVATE_KEY=<your-privkey>
  #     # - WIREGUARD_ADDRESSES=10.x.x.x/32

volumes:
  usatv-cache:
